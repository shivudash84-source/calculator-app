<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <div class="display-wrap">
        <div id="expression" class="expression">0</div>
        <div id="result" class="result">0</div>
      </div>

      <div class="buttons">
        <button class="btn secondary" data-action="clear">AC</button>
        <button class="btn secondary" data-action="delete">DEL</button>
        <button class="btn secondary" data-action="parenthesis-open">(</button>
        <button class="btn secondary" data-action="parenthesis-close">)</button>

        <button class="btn secondary" data-value="π">π</button>
        <button class="btn secondary" data-value="e">e</button>
        <button class="btn secondary" data-value="^">xʸ</button>
        <button class="btn operator" data-value="/">÷</button>

        <button class="btn secondary" data-value="sin(">sin</button>
        <button class="btn secondary" data-value="cos(">cos</button>
        <button class="btn secondary" data-value="tan(">tan</button>
        <button class="btn operator" data-value="*">×</button>

        <button class="btn secondary" data-value="log(">log</button>
        <button class="btn secondary" data-value="ln(">ln</button>
        <button class="btn secondary" data-value="sqrt(">√</button>
        <button class="btn operator" data-value="-">−</button>

        <button class="btn secondary" data-value="%">%</button>
        <button class="btn secondary" data-value="x²">x²</button>
        <button class="btn secondary" data-value="x³">x³</button>
        <button class="btn operator" data-value="+">+</button>

        <button class="btn number" data-value="7">7</button>
        <button class="btn number" data-value="8">8</button>
        <button class="btn number" data-value="9">9</button>
        <button class="btn operator" data-value=".">.</button>

        <button class="btn number" data-value="4">4</button>
        <button class="btn number" data-value="5">5</button>
        <button class="btn number" data-value="6">6</button>
        <button class="btn equals" data-action="equals">=</button>

        <button class="btn number" data-value="1">1</button>
        <button class="btn number" data-value="2">2</button>
        <button class="btn number" data-value="3">3</button>
        <button class="btn number zero" data-value="0">0</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
